[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-events-llm-benchmarks"
version = "0.1.0"
description = "Benchmark for natural-language live event search: constraint-labeled queries, synthetic catalog, code-based scoring"
readme = "README.md"
license = "MIT"
authors = [{ name = "Balajee Kalyanasundaram", email = "balajeekalyanasundaram@ieee.org" }]
requires-python = ">=3.10"
dependencies = [
    "figureout>=0.2.8",
    "nlq-validator>=0.1.0",
    "mcp>=1.25,<2",  # figureout reads FastMCP internals; mcp 2.x renamed FastMCP
    "python-dotenv",
]

[project.optional-dependencies]
embeddings = ["nlq-validator[embeddings]"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
live_events_llm_benchmarks = ["data/*.json", "validator_data/*.txt"]
